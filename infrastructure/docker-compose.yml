version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: segi-crm-postgres
    environment:
      POSTGRES_DB: segi-crm
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - segi-crm-network

  redis:
    image: redis:7-alpine
    container_name: segi-crm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - segi-crm-network

  minio:
    image: minio/minio:latest
    container_name: segi-crm-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - segi-crm-network

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: segi-crm-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/segi-crm
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/segi-crm
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: your-secret-key-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-in-production
      PORT: 3000
      ENCRYPTION_KEY: your-encryption-key-32-chars-min
      META_WEBHOOK_TOKEN: your-meta-token-here
      UAZAPI_TOKEN: your-uazapi-token-here
      UAZAPI_INSTANCE: your-uazapi-instance-here
    ports:
      - "3000:3000"
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../apps/api/dist:/app/apps/api/dist
    networks:
      - segi-crm-network
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: segi-crm-web
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ../apps/web/src:/app/apps/web/src
      - ../apps/web/public:/app/apps/web/public
    networks:
      - segi-crm-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  segi-crm-network:
    driver: bridge
